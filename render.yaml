services:
  - type: web
    name: aapkastar-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/categories
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEV_MODE
        value: "false"
      - key: AUTO_APPROVE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
