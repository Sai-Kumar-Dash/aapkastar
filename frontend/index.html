<body>
<nav><div class="topbar"><a class="redditish-logo" href="#/" aria-label="YourFavStar home"><span class="brand-mark" aria-label="YourFavStar logo"></span><span>YourFavStar</span></a><form class="global-search" onsubmit="globalSearch(event)"><span class="search-icon">⌕</span><input id="globalSearch" autocomplete="off" placeholder="Find creators, events, stories…" aria-label="Search YourFavStar"><button type="submit">Search</button></form><div id="na"></div></div></nav>
<main id="app"></main><div id="toast" role="status"></div>
<footer><div class="wrap"><b style="color:#fff;font:700 24px var(--d)">YourFavStar.</b><p style="max-width:520px">A focused marketplace for discovering and booking creators, performers and artists for moments that matter.</p><br><a href="#/discover">Browse artists</a><a href="#/signup?role=ARTIST">For artists</a><a href="#/login">Sign in</a></div></footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),inr=n=>'₹'+(+n).toLocaleString('en-IN');
let U=null,T=localStorage.getItem('t'),LIB={a:new Set(),p:new Set()},AU={};try{U=JSON.parse(localStorage.getItem('u'))}catch(e){}
const app=h=>{$('#app').innerHTML=h},ago=d=>{const s=(Date.now()-new Date(d))/1e3;return s<3600?Math.max(1,s/60|0)+'m':s<86400?(s/3600|0)+'h':(s/86400|0)+'d'};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3200)}
async function api(p,o={}){const h={'Content-Type':'application/json'};if(T)h.Authorization='Bearer '+T;let r;
try{r=await fetch(CFG.API+p,{method:o.m||'GET',headers:h,body:o.b?JSON.stringify(o.b):undefined})}catch(e){throw new Error('Cannot reach the server. Check API in config.js.')}
const j=await r.json().catch(()=>null);if(r.status===401&&T&&!p.includes('/auth/')){logout(true)}if(!r.ok)throw new Error((j&&j.message)||'Something went wrong. Try again.');return j}
function setU(u,t){U=u;T=t;if(u){localStorage.setItem('u',JSON.stringify(u));localStorage.setItem('t',t)}else{localStorage.removeItem('u');localStorage.removeItem('t')}LIB={a:new Set(),p:new Set()}}
async function loadLib(){if(!U)return null;try{FOL=new Set(await api('/api/me/follows'));const l=await api('/api/me/library');LIB.a=new Set(l.artists.map(a=>a.id));LIB.p=new Set(l.posts.map(p=>p.id));return l}catch(e){return null}}
function logout(exp){setU(null,null);nav();if(exp)toast('Your session expired. Log in again.');location.hash='#/login'}
document.documentElement.dataset.theme='dark';
function nav(){
 const n=$('#na');
 if(U){
   n.innerHTML=`${U.role==='ARTIST'?'<a class="btn ghost sm" href="#/studio">My studio</a>':''}<a class="btn ghost sm" href="#/saved">Saved</a><a class="btn sm" href="#/" onclick="logout();return false">Log out</a><span class="nav-more">•••</span>`;
 }else{
   n.innerHTML=`<a class="btn ghost sm" href="#/signup">Sign Up</a><a class="btn sm" href="#/login">Log In</a><span class="nav-more">•••</span>`;
 }
}
async function tog(k,id,b){if(!U){toast('Log in first.');return location.hash='#/login'}const on=LIB[k].has(id);try{await api(PATH[k]+id,{m:on?'DELETE':'PUT'});on?LIB[k].delete(id):LIB[k].add(id);b.classList.toggle('on',!on)}catch(e){toast(e.message)}}
const av=(url,name,id,c='')=>url?`<img class="av ${c}" src="${esc(url)}" alt="">`:`<span class="av ${c}" style="background:hsl(${(id*47)%360} 60% 45%)">${esc((name||'?')[0])}</span>`;
const card=(a,i=0)=>`<div class="card pop" style="--i:${i}"><button class="heart ${LIB.a.has(a.id)?'on':''}" onclick="tog('a',${a.id},this)" aria-label="Save artist">♥</button><a href="#/artist/${esc(a.slug)}"><div class="ph" style="background:hsl(${(a.id*47)%360} 60% 40%)">${a.avatarUrl?`<img src="${esc(a.avatarUrl)}" alt="">`:esc(a.stageName[0])}<span class="cat">${esc(a.category)}</span></div><div class="in"><h3>${esc(a.stageName)}${a.verified?'<i class="vf">✓</i>':''}</h3><div class="mu">📍 ${esc(a.city)}${a.rating?' · ★ '+a.rating.toFixed(1):''}</div><div class="pr"><span><small>From</small> <b>${inr(a.startingPrice)}</b></span><span class="go">Get quote →</span></div></div></a></div>`;
const media=p=>{const u=p.mediaUrl;if(!u)return'';if(p.type==='PHOTO')return`<img class="m" loading="lazy" src="${esc(u)}" alt="">`;const y=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return y?`<iframe class="m" src="https://www.youtube.com/embed/${y[1]}" allowfullscreen loading="lazy"></iframe>`:`<video class="m" src="${esc(u)}" controls preload="metadata" playsinline></video>`};
let post=(p,i=0,own)=>`<article class="post pop" style="--i:${i}"><header><a href="#/artist/${esc(p.artistSlug)}">${av(p.avatarUrl,p.artistName,p.artistId)}${esc(p.artistName)}</a><time>${ago(p.createdAt)}</time>${own?`<button class="btn ghost sm" onclick="delPost(${p.id})">Delete</button>`:`<button class="bm ${LIB.p.has(p.id)?'on':''}" onclick="tog('p',${p.id},this)" aria-label="Save post">🔖</button>`}</header>${p.text?`<p>${esc(p.text)}</p>`:''}${media(p)}</article>`;
const empty=t=>`<div class="empty">${t}</div>`;
async function up(file){if(file.size>80*1048576)throw new Error('File is too large (max 80 MB).');if(!CFG.CLOUD_NAME)throw new Error('Uploads are not configured yet (Cloudinary).');const f=new FormData();f.append('file',file);f.append('upload_preset',CFG.UPLOAD_PRESET);const r=await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUD_NAME}/auto/upload`,{method:'POST',body:f});const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'Upload failed');return j.secure_url}
const q=h=>Object.fromEntries(new URLSearchParams(h.split('?')[1]||''));

const EMO={singer:'🎤',dj:'🎧',band:'🎸',dancer:'💃',comedian:'🎭',anchor:'🎙️',musician:'🎹',magician:'🪄',rapper:'🔥'};
function initScrollFx(){const els=[...document.querySelectorAll('.reveal')];if(!('IntersectionObserver' in window)){els.forEach(x=>x.classList.add('in'));return}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.14,rootMargin:'0px 0px -7% 0px'});els.forEach(x=>io.observe(x))}

let FD={items:[],sort:'hot',type:'ALL'},VT=new Set();
const hotS=x=>(x.votes+1+(x.comments||0)*2)/Math.pow((Date.now()-x.t)/36e5+2,1.5);
async function vote(k,id){if(!U){toast('Log in to vote.');location.hash='#/login';return}const key=k+'-'+id,on=VT.has(key);try{await api('/api/me/votes/'+k+'/'+id,{m:on?'DELETE':'PUT'});const it=FD.items.find(x=>x.k===k&&x.id===id);on?VT.delete(key):VT.add(key);if(it)it.votes+=on?-1:1;drawFeed()}catch(e){toast(e.message)}}
function rcard(x,i){const d=`class="rp pop" style="--i:${Math.min(i,6)}"`;
if(x.k==='NEWS')return `<article ${d}><div class="vt"><span style="font-size:22px;padding-top:4px">🤖</span></div><div class="rb"><div class="rm"><span class="flair bot">Bot</span><b>YourFavStar Bot</b><span class="mu">· ${ago(x.createdAt)}</span></div><h3><a href="${x.eventId?'#/event/'+x.eventId:'#/discover'}">${esc(x.headline)}</a></h3><p class="mu">${esc(x.body||'')}</p></div></article>`;
const vt=`<div class="vt"><button class="${VT.has(x.k+'-'+x.id)?'on':''}" onclick="vote('${x.k}',${x.id})" aria-label="Upvote">▲</button><b>${x.votes}</b></div>`;
const hd=`<div class="rm">${av(x.avatarUrl,x.artistName,x.artistId)}<a href="#/artist/${esc(x.artistSlug)}">${esc(x.artistName)}</a><span class="flair">${x.k==='EVENT'?'Event':'Post'}</span><span class="mu">· ${ago(x.createdAt)}</span></div>`;
if(x.k==='EVENT')return `<article ${d}>${vt}<div class="rb">${hd}<h3><a href="#/event/${x.id}">${esc(x.title)}</a></h3><div class="rchips"><span>📍 ${esc(x.city)}</span><span>🗓️ ${fdt(x.startsAt)}</span><span>🎟️ ${x.ticketPrice?inr(x.ticketPrice):'Free'}</span></div>${x.description?`<p>${esc(x.description.slice(0,220))}</p>`:''}<div class="ra"><a href="#/event/${x.id}">💬 ${x.comments} comments</a><a href="#/artist/${esc(x.artistSlug)}">Book</a><button onclick="follow(${x.artistId},this)">${FOL.has(x.artistId)?'Following ✓':'Follow'}</button></div></div></article>`;
return `<article ${d}>${vt}<div class="rb">${hd}${x.text?`<p>${esc(x.text)}</p>`:''}${media(x)}<div class="ra"><a href="#/artist/${esc(x.artistSlug)}">View profile</a><button class="bm ${LIB.p.has(x.id)?'on':''}" style="width:auto;height:auto;border:0" onclick="tog('p',${x.id},this)">🔖 Save</button></div></div></article>`}
function tabs(){document.querySelectorAll('.rbar button').forEach(b=>b.classList.toggle('on',b.dataset.s?b.dataset.s===FD.sort:b.dataset.t===FD.type))}
function drawFeed(){let L=FD.items.filter(x=>FD.type==='ALL'||x.k===FD.type);L=[...L].sort(FD.sort==='new'?(a,b)=>b.t-a.t:FD.sort==='top'?(a,b)=>b.votes-a.votes:(a,b)=>hotS(b)-hotS(a));$('#rf').innerHTML=L.length?L.map(rcard).join(''):empty('Nothing here yet. Follow creators and check back soon.')}
const FAKE_HOME_POSTS=[];
let fakeVotes=new Set();
function fakePost(){return ''}
function fakeVote(){}
function drawFakeFeed(){const el=$('#fakeFeed');if(el)el.innerHTML=''}
function globalSearch(e){e.preventDefault();const q=($('#globalSearch')||{}).value?.trim();if(q)location.hash='#/discover?q='+encodeURIComponent(q);else location.hash='#/discover'}

function openPro(){
 const old=document.getElementById('proModal'); if(old) old.remove();
 document.body.insertAdjacentHTML('beforeend',`<div id="proModal" class="modal" style="display:grid">
   <div class="box" style="width:min(460px,calc(100vw - 28px));padding:24px;position:relative">
     <button class="x" onclick="document.getElementById('proModal').remove()">×</button>
     <span class="premium-badge">★ YOURFAVSTAR PRO</span>
     <h2 style="font-size:34px;margin:12px 0">Pro starts at ₹49.</h2>
     <p class="mu">Unlock the social layer around creator bookings.</p>
     <div class="box" style="padding:14px;margin:14px 0;background:#0b0b0b">
       <b>Included</b>
       <p class="mu" style="margin:8px 0 0">• Comment with GIFs on eligible posts<br>• Message up to 2 creators at a time<br>• Up to 5 messages per creator before acceptance<br>• Member-only booking discounts</p>
     </div>
     <div class="row">
       <button class="btn" onclick="choosePay('UPI')">UPI</button>
       <button class="btn ghost" onclick="choosePay('CARD')">Card</button>

function choosePay(m){$('#payNote').textContent=m+' selected. Connect your Razorpay/UPI payment key to complete the ₹49 checkout.'}

async function discover(h){const Q=q(h);let cats=[];try{cats=await api('/api/categories')}catch(e){}
app(`<div class="wrap"><h2 class="t" style="margin-top:28px">Discover artists</h2><div class="bar"><input id="fq" placeholder="Search name, language, style" value="${esc(Q.q)}"><select id="fc"><option value="">All types</option>${cats.map(c=>`<option value="${c.slug}" ${Q.cat==c.slug?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input id="fci" placeholder="City" value="${esc(Q.city)}"><input id="fm" type="number" placeholder="Max budget ₹"><select id="fs"><option value="rating">Top rated</option><option value="price">Lowest price</option><option value="exp">Most experienced</option></select></div><div class="grid" id="g"></div></div>`);
const go=async()=>{const p=new URLSearchParams({q:$('#fq').value,category:$('#fc').value,city:$('#fci').value,sort:$('#fs').value,size:48});if($('#fm').value)p.set('maxPrice',$('#fm').value);
try{const r=await api('/api/artists?'+p);$('#g').innerHTML=r.content.length?r.content.map(card).join(''):empty('No artists match. Try different filters.')}catch(e){$('#g').innerHTML=empty(esc(e.message))}};
['fq','fc','fci','fm','fs'].forEach(i=>$('#'+i).addEventListener('input',()=>{clearTimeout(go.t);go.t=setTimeout(go,300)}));await loadLib();go()}

async function artist(slug){app(`<div class="wrap">${empty('Loading…')}</div>`);try{const [a,ps,es]=await Promise.all([api('/api/artists/'+slug),api('/api/artists/'+slug+'/posts'),api('/api/artists/'+slug+'/events'),loadLib()]);
app(`<div class="wrap"><div class="cover" style="${a.coverUrl?`background-image:url('${esc(a.coverUrl)}')`:`background:linear-gradient(150deg,hsl(${(a.id*47)%360} 65% 45%),hsl(${(a.id*47+60)%360} 70% 25%))`}"></div>
<div class="pro">${av(a.avatarUrl,a.stageName,a.id,'big')}<div style="flex:1"><h1>${esc(a.stageName)}${a.verified?' <i class="vf" style="width:24px;height:24px;font-size:13px">✓</i>':''}</h1><div class="mu">${esc(a.category)} · ${esc(a.city)}${a.rating?' · ★ '+a.rating.toFixed(1):''}</div></div><button class="heart ${LIB.a.has(a.id)?'on':''}" style="width:auto;padding:0 16px" onclick="tog('a',${a.id},this)">♥ Save</button><button class="btn ghost sm" onclick="follow(${a.id},this)">${FOL.has(a.id)?'Following ✓':'Follow'}</button></div>
<div class="stats"><div><b>${inr(a.startingPrice)}</b><span>Starting price</span></div><div><b>${a.experienceYears} yrs</b><span>Experience</span></div><div><b>${a.bookings}</b><span>Bookings</span></div></div>
<div class="two bk"><div style="display:grid;gap:18px"><div class="box"><h3>About</h3><p style="white-space:pre-wrap">${esc(a.bio)||'<span class="mu">No bio yet.</span>'}</p>${a.languages.length?`<p class="mu">Languages: ${esc(a.languages.join(', '))}</p>`:''}</div><div><h3 style="margin-bottom:10px">Events</h3><div class="evgrid">${es.length?es.map(ev).join(''):empty('No events listed yet.')}</div></div><div class="feed" style="max-width:none"><h3>Posts</h3>${ps.length?ps.map((p,i)=>post(p,i)).join(''):empty('No posts yet.')}</div></div>
<form class="box f book" onsubmit="sendEnq(event,${a.id})"><h3>Check availability &amp; get a quote</h3><label>Event type<select name="eventType"><option>Wedding</option><option>Birthday</option><option>Corporate event</option><option>College fest</option><option>Private party</option><option>Other</option></select></label>
<div class="row"><label>Date<input type="date" name="eventDate" required min="${new Date().toISOString().slice(0,10)}"></label><label>City<input name="city" required value="${esc(a.city)}"></label></div><div class="row"><label>Guests<input type="number" name="guests" min="1"></label><label>Budget (₹)<input type="number" name="budget" min="0"></label></div>
<label>Details<textarea name="message" rows="3" maxlength="1000" placeholder="Venue, timing, special requests…"></textarea></label><button class="btn">Request quote</button><span class="mu" style="font-size:13px">Free. No payment until you confirm with the artist.</span></form></div></div>`)}catch(e){app(`<div class="wrap" style="padding:40px 0">${empty(esc(e.message))}</div>`)}}
async function sendEnq(e,id){e.preventDefault();if(!U){toast('Log in to send a request.');location.hash='#/login';return}if(U.role!=='CUSTOMER'){toast('Use a customer account to book artists.');return}
const f=e.target,b=f.querySelector('button');b.disabled=true;try{await api('/api/artists/'+id+'/enquiries',{m:'POST',b:{eventType:f.eventType.value,eventDate:f.eventDate.value,city:f.city.value,guests:f.guests.value?+f.guests.value:null,budget:f.budget.value?+f.budget.value:null,message:f.message.value}});toast('Request sent! The artist will reply soon.');location.hash='#/enquiries'}catch(x){toast(x.message);b.disabled=false}}
async function enquiries(){if(!U){location.hash='#/login';return}app(`<div class="wrap"><h2 class="t" style="margin-top:28px">${U.role==='ARTIST'?'Booking requests':'My requests'}</h2><div class="feed" id="eq">${empty('Loading…')}</div></div>`);
try{const r=await api('/api/me/enquiries'),A=U.role==='ARTIST';$('#eq').innerHTML=r.length?r.map(e=>`<div class="box pop"><div style="display:flex;gap:10px;justify-content:space-between"><b>${esc(e.eventType)} · ${esc(e.eventDate)}</b><span class="st ${e.status}">${e.status}</span></div><p class="mu" style="margin:6px 0">${A?'From '+esc(e.customerName):'<a href="#/artist/'+esc(e.artistSlug)+'">'+esc(e.artistName)+'</a>'} · ${esc(e.city)}${e.guests?' · '+e.guests+' guests':''}${e.budget?' · budget '+inr(e.budget):''}</p>${e.message?`<p style="margin:0 0 8px">${esc(e.message)}</p>`:''}${A&&e.status==='NEW'?`<button class="btn sm" onclick="setEnq(${e.id},'ACCEPTED')">Accept</button> <button class="btn ghost sm" onclick="setEnq(${e.id},'DECLINED')">Decline</button>`:''}</div>`).join(''):empty('Nothing here yet.')}catch(x){$('#eq').innerHTML=empty(esc(x.message))}}
async function setEnq(id,s){try{await api('/api/me/enquiries/'+id+'/'+s,{m:'POST'});enquiries()}catch(x){toast(x.message)}}

function authPage(h){const su=h.startsWith('#/signup');AU={su,role:q(h).role==='ARTIST'?'ARTIST':'CUSTOMER'};
app(`<div class="wrap"><div class="auth box pop"><h2>${su?'Create your account':'Welcome back'}</h2><p class="mu">${su?'Join YourFavStar to book artists or get booked.':'Log in to your account.'}</p><form class="f" id="af">
${su?`<div class="roles">${[['CUSTOMER','I need an artist','Book for an event'],['ARTIST','I am an artist','Get booked']].map(r=>`<button type="button" class="opt ${AU.role==r[0]?'on':''}" data-r="${r[0]}" onclick="AU.role='${r[0]}';document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on',b.dataset.r==AU.role))"><b>${r[1]}</b><span>${r[2]}</span></button>`).join('')}</div><label>Full name<input name="name" required autocomplete="name"></label>`:''}
<label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="${su?8:1}" autocomplete="${su?'new':'current'}-password" placeholder="${su?'At least 8 characters':''}"></label>
<button class="btn" id="sb">${su?'Sign up':'Log in'}</button><div class="or">or</div><div id="gb" style="display:flex;justify-content:center"></div></form>
<p class="mu" style="text-align:center;margin:14px 0 0">${su?'Have an account? <a href="#/login" style="color:var(--br);font-weight:700">Log in</a>':'New here? <a href="#/signup" style="color:var(--br);font-weight:700">Sign up</a>'}</p></div></div>`);
$('#af').onsubmit=async e=>{e.preventDefault();const f=e.target,b=$('#sb');b.disabled=true;try{done(await api(su?'/api/auth/register':'/api/auth/login',{m:'POST',b:su?{name:f.name.value,email:f.email.value,password:f.password.value,role:AU.role}:{email:f.email.value,password:f.password.value}}))}catch(x){toast(x.message);b.disabled=false}};
const g=()=>{if(!CFG.GOOGLE_CLIENT_ID){$('#gb').parentNode.querySelector('.or').remove();return}if(!(window.google&&google.accounts))return setTimeout(g,300);
google.accounts.id.initialize({client_id:CFG.GOOGLE_CLIENT_ID,callback:async r=>{try{done(await api('/api/auth/google',{m:'POST',b:{idToken:r.credential,role:su?AU.role:undefined}}))}catch(x){toast(x.message)}}});
google.accounts.id.renderButton($('#gb'),{theme:'outline',size:'large',text:su?'signup_with':'signin_with',width:300})};g()}
async function done(j){setU(j.user,j.token);nav();await loadLib();toast('Welcome, '+j.user.name.split(' ')[0]+'!');location.hash=j.user.role==='ARTIST'?'#/studio':'#/'}

async function studio(){if(!U||U.role!=='ARTIST'){location.hash='#/login';return}
const [cats,m]=await Promise.all([api('/api/categories'),api('/api/me/artist-profile').catch(()=>({}))]);let mine=[];if(m.slug&&m.verified)mine=await api('/api/artists/'+m.slug+'/posts').catch(()=>[]);
app(`<div class="wrap"><div class="two"><form class="box f" id="pf"><h2>Your profile</h2>${m.slug?`<a href="#/artist/${esc(m.slug)}" style="color:var(--br);font-weight:700">View public page</a>${m.verified?'':'<p class="mu">Your profile is waiting for approval.</p>'}`:'<p class="mu">Complete this to appear in search.</p>'}
<div class="row"><label>Profile photo<input type="file" accept="image/*" data-t="avatarUrl"></label><label>Cover photo<input type="file" accept="image/*" data-t="coverUrl"></label></div>
<input type="hidden" name="avatarUrl" value="${esc(m.avatarUrl)}"><input type="hidden" name="coverUrl" value="${esc(m.coverUrl)}">
<label>Stage name<input name="stageName" required value="${esc(m.stageName)}"></label><div class="row"><label>Category<select name="categorySlug">${cats.map(c=>`<option value="${c.slug}" ${m.category==c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>City<input name="city" required value="${esc(m.city)}"></label></div>
<label>About you<textarea name="bio" rows="4" maxlength="2000">${esc(m.bio)}</textarea></label><label>Languages (comma separated)<input name="languages" value="${esc((m.languages||[]).join(', '))}"></label>
<div class="row"><label>Years of experience<input type="number" name="experienceYears" min="0" max="60" value="${m.experienceYears||0}"></label><label>Starting price (₹)<input type="number" name="startingPrice" min="500" required value="${m.startingPrice||''}"></label></div><button class="btn" id="pb">Save profile</button></form>
<div style="display:grid;gap:18px"><form class="box f" id="nf"><h2>New post</h2><select name="type" onchange="pType(this.form)"><option value="TEXT">Article / text</option><option value="PHOTO">Photo</option></select>
<textarea name="text" rows="3" maxlength="2000" placeholder="Share an update, a gig, a new song…"></textarea><input type="file" name="file" hidden><input name="link" placeholder="…or paste a YouTube link" hidden><button class="btn" id="nb" ${m.slug?'':'disabled'}>Publish</button>${m.slug?'':'<span class="mu">Save your profile first.</span>'}</form>
<div class="feed" style="max-width:none"><h3>Your posts</h3>${mine.length?mine.map((p,i)=>post(p,i,1)).join(''):empty('Nothing posted yet.')}</div></div></div></div>`);
document.querySelectorAll('#pf input[type=file]').forEach(i=>i.onchange=async()=>{if(!i.files[0])return;toast('Uploading…');try{$('#pf [name='+i.dataset.t+']').value=await up(i.files[0]);toast('Uploaded. Remember to save.')}catch(e){toast(e.message)}});
$('#pf').onsubmit=async e=>{e.preventDefault();const f=e.target;$('#pb').disabled=true;try{await api('/api/me/artist-profile',{m:'PUT',b:{stageName:f.stageName.value,categorySlug:f.categorySlug.value,city:f.city.value,bio:f.bio.value,languages:f.languages.value.split(',').map(s=>s.trim()).filter(Boolean),experienceYears:+f.experienceYears.value,startingPrice:+f.startingPrice.value,avatarUrl:f.avatarUrl.value||null,coverUrl:f.coverUrl.value||null}});toast('Profile saved.');studio()}catch(x){toast(x.message);$('#pb').disabled=false}};
$('#nf').onsubmit=async e=>{e.preventDefault();const f=e.target,b=$('#nb');b.disabled=true;try{let url=f.link.value.trim();if(f.file.files[0]){toast('Uploading…');url=await up(f.file.files[0])}
await api('/api/me/posts',{m:'POST',b:{type:f.type.value,text:f.text.value,mediaUrl:f.type.value==='TEXT'?null:url}});toast('Posted.');studio()}catch(x){toast(x.message);b.disabled=false}}}
function pType(f){const t=f.type.value;f.file.hidden=t==='TEXT';f.file.accept=t==='PHOTO'?'image/*':'video/*';f.link.hidden=t!=='VIDEO'}
async function delPost(id){if(!confirm('Delete this post?'))return;try{await api('/api/me/posts/'+id,{m:'DELETE'});studio()}catch(e){toast(e.message)}}

async function saved(){if(!U){location.hash='#/login';return}app(`<div class="wrap"><h2 class="t" style="margin-top:28px">Saved artists</h2><div class="grid" id="sa"></div><h2 class="t" style="margin-top:36px">Saved posts</h2><div class="feed" id="sp"></div></div>`);
const l=await loadLib();if(!l)return;$('#sa').innerHTML=l.artists.length?l.artists.map(card).join(''):empty('Tap ♥ on an artist to save them here.');$('#sp').innerHTML=l.posts.length?l.posts.map((p,i)=>post(p,i)).join(''):empty('Tap 🔖 on a post to save it here.')}

const fdt=d=>new Date(d).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const ev=(e,i=0)=>`<a class="evc pop" style="--i:${i}" href="#/event/${e.id}"><div class="evd"><b>${new Date(e.startsAt).getDate()}</b><span>${new Date(e.startsAt).toLocaleString('en-IN',{month:'short'})}</span></div><div class="evb"><span class="mu">${esc(e.artistName)}</span><h3>${esc(e.title)}</h3><div class="mu">📍 ${esc(e.city)} · ${fdt(e.startsAt)} · ${e.ticketPrice?inr(e.ticketPrice):'Free entry'} · 💬 ${e.comments}</div></div></a>`;
const nw=n=>`<a class="nw" href="${n.eventId?'#/event/'+n.eventId:'#/discover'}"><b>${esc(n.headline)}</b><span class="mu">${esc(n.body||'')} · ${ago(n.createdAt)}</span></a>`;
async function follow(id,b){if(!U){toast('Log in to follow creators.');location.hash='#/login';return}const on=FOL.has(id);try{await api('/api/me/follows/'+id,{m:on?'DELETE':'PUT'});on?FOL.delete(id):FOL.add(id);b.textContent=on?'Follow':'Following ✓';if(!on)toast('You will get alerts for their new events.')}catch(x){toast(x.message)}}
async function evPage(id){app(`<div class="wrap">${empty('Loading…')}</div>`);try{const [r]=await Promise.all([api('/api/events/'+id),loadLib()]),e=r.event;
app(`<div class="wrap" style="padding:28px 0"><a class="mu" href="#/artist/${esc(e.artistSlug)}">← ${esc(e.artistName)}</a><div class="two" style="margin-top:14px"><div class="box"><span class="eyebrow">Live event</span><h1 style="font-size:clamp(30px,5vw,52px);margin:12px 0">${esc(e.title)}</h1><p class="mu">📍 ${esc(e.venue?e.venue+', ':'')}${esc(e.city)}<br>🗓️ ${fdt(e.startsAt)}<br>🎟️ ${e.ticketPrice?inr(e.ticketPrice):'Free entry'}</p><p style="white-space:pre-wrap">${esc(e.description)}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn" href="#/artist/${esc(e.artistSlug)}">Book ${esc(e.artistName)}</a><button class="btn ghost" onclick="follow(${e.artistId},this)">${FOL.has(e.artistId)?'Following ✓':'Follow for updates'}</button></div></div>
<div class="box"><h3>Comments (${r.comments.length})</h3><form class="f" onsubmit="cmt(event,${e.id})"><textarea name="body" rows="2" maxlength="500" required placeholder="Say something about this event…"></textarea><button class="btn sm">Comment</button></form>${r.comments.map(c=>`<div class="nw"><b>${esc(c.name)}</b><span>${esc(c.body)}</span><span class="mu">${ago(c.createdAt)}</span></div>`).join('')}</div></div></div>`)}catch(x){app(`<div class="wrap" style="padding:40px 0">${empty(esc(x.message))}</div>`)}}
async function cmt(e2,id){e2.preventDefault();if(!U){toast('Log in to comment.');location.hash='#/login';return}try{await api('/api/events/'+id+'/comments',{m:'POST',b:{body:e2.target.body.value}});evPage(id)}catch(x){toast(x.message)}}
function announce(){if(!U||U.role!=='ARTIST'){location.hash='#/login';return}
app(`<div class="wrap" style="padding:28px 0"><div class="box" style="max-width:640px"><h2>Announce an event</h2><p class="mu">Your followers get an alert and the bot posts it on the home page.</p><form class="f" onsubmit="mkEv(event)"><label>Title<input name="title" required maxlength="140" placeholder="Live acoustic night"></label><div class="row"><label>Date &amp; time<input type="datetime-local" name="startsAt" required></label><label>Ticket price (₹, 0 = free)<input type="number" name="ticketPrice" min="0" value="0"></label></div><div class="row"><label>Venue<input name="venue" maxlength="160"></label><label>City<input name="city" required></label></div><label>Details<textarea name="description" rows="4" maxlength="2000"></textarea></label><button class="btn">Publish event</button></form></div></div>`)}
async function mkEv(e2){e2.preventDefault();const f=e2.target;try{const r=await api('/api/me/events',{m:'POST',b:{title:f.title.value,startsAt:f.startsAt.value,ticketPrice:+f.ticketPrice.value,venue:f.venue.value,city:f.city.value,description:f.description.value}});toast('Event published.');location.hash='#/event/'+r.id}catch(x){toast(x.message)}}
async function alerts(){if(!U){location.hash='#/login';return}app(`<div class="wrap" style="padding:28px 0"><h2 class="t">Alerts</h2><div class="feed" id="al">${empty('Loading…')}</div></div>`);try{const r=await api('/api/me/notifications');$('#al').innerHTML=r.items.length?r.items.map(n=>`<a class="nw" href="${esc(n.link||'#/')}"><b>${esc(n.text)}</b><span class="mu">${ago(n.createdAt)}</span></a>`).join(''):empty('Follow creators to get alerts when they announce events.');api('/api/me/notifications/read',{m:'POST'}).catch(()=>{})}catch(x){$('#al').innerHTML=empty(esc(x.message))}}
function route(){const h=location.hash||'#/';scrollTo(0,0);nav();
if(h.startsWith('#/discover'))discover(h);else if(h.startsWith('#/artist/'))artist(h.split('/')[2]);else if(h.startsWith('#/login')||h.startsWith('#/signup'))authPage(h);else if(h.startsWith('#/studio'))studio();else if(h.startsWith('#/saved'))saved();else if(h.startsWith('#/enquiries'))enquiries();else if(h.startsWith('#/event/'))evPage(h.split('/')[2]);else if(h.startsWith('#/announce'))announce();else if(h.startsWith('#/alerts'))alerts();else home()}

</script>
<script src="feature_overrides.js"></script>
<script src="yfs_home.js"></script>
<script src="shell.js"></script>
</body>
</html>
