server:
  port: 8080
  error:
    include-message: always
spring:
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mehfil}
    username: ${DB_USER:mehfil}
    password: ${DB_PASSWORD:mehfil}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-string-of-32-plus-chars}
  jwt-ttl-hours: 168
  dev-mode: ${DEV_MODE:true}            # true = OTP is logged and returned in the API response. Set false in production.
  auto-approve-artists: ${AUTO_APPROVE:true}   # true = new artist profiles go live immediately (dev only)
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000}
  google-client-id: ${GOOGLE_CLIENT_ID:}

  razorpay-key-id: ${RAZORPAY_KEY_ID:}
  razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
